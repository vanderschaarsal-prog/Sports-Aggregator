[project]
name = "sports-aggregator"
version = "0.1.0"
description = "Sports news aggregator"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "httpx==0.27.2",
    "feedparser==6.0.11",
    "uvicorn==0.30.6",
]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

